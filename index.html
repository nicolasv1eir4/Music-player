
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">

        <header class="top-bar">
            <div class="logo">
                <span class="logo-icon">♫</span>
                <h1>Music<span>Player</span></h1>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Tocando suas músicas
            </div>
        </header>

        <section class="player-container">

            <div class="album-cover">
                <img
                    id="cover"
                    src="imagens/capa.avif"
                    alt="Capa do álbum"
                >
                <div class="cover-overlay">
                    <span>♫</span>
                </div>
            </div>

            <div class="music-info">
                <p class="music-label">TOCANDO AGORA</p>

                <h2 id="music-title">Linha do equador</h2>

                <p id="artist-name">Djavan</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>

                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn secondary" id="prev"
                    aria-label="Música anterior" title="Anterior">
                    &#9198;
                </button>

                <button class="control-btn play-btn" id="play"
                    aria-label="Reproduzir ou pausar" title="Play/Pause">
                    &#9654;
                </button>

                <button class="control-btn secondary" id="next"
                    aria-label="Próxima música" title="Próxima">
                    &#9197;
                </button>
            </div>

            <div class="volume-container">
                <span>♫</span>
                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.7"
                    aria-label="Volume"
                >
                <span>🔊</span>
            </div>

            <audio id="audio" preload="metadata"></audio>

        </section>

        <footer class="footer">
            <p>Music Player</p>
            <span>Seu som, seu momento.</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
